<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Baviya ❤️</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

</head>

<body>

<div id="intro">

```
<h2 class="loading">
    Suprise for my Beloved...
</h2>

<h1 id="name"></h1>

<button id="giftBtn">
    🎁 Open Your Gift
</button>
```

</div>

<div id="birthdayPage" class="hidden">

```
<h1 class="title">
    Happy Birthday Baviya ❤️
</h1>

<img src="images/bavi.jpeg" class="profile">

<div class="cake-wrapper">

    <div class="cake3d">

        <div class="tier tier1"></div>
        <div class="tier tier2"></div>
        <div class="tier tier3"></div>

        <div class="candle">
            <div class="flame" id="flame"></div>
        </div>

    </div>

</div>

<button id="voiceBtn">
    🎙️ Listen To My Message
</button>

<button id="blowBtn">
    🕯️ Blow Candle
</button>

<audio id="voice">
    <source src="audio/voice.mp4" type="audio/mpeg">
</audio>

<!-- Background Music -->
<audio id="bgMusic" loop>
    <source src="audio/bg music.mpeg" type="audio/mpeg">
</audio>
<div id="message"></div>

<div class="gallery">

    <img src="images/memory 1.jpeg">
    <img src="images/memory 2.jpeg">
    <img src="images/memory 3.jpeg">

</div>
```

</div>

<script src="script.js"></script>

</body>

</html>
